name: huawei-campus

mgmt:
  network: campus-mgmt
  ipv4-subnet: 172.31.255.0/24

topology:
  defaults:
    env:
      SNMP_COMMUNITY: librenms-lab

  kinds:
    huawei_vrp:
      image: ${CORE_IMAGE:=mrja/campus-core01:ce12800-8.180}

  nodes:
    core01:
      kind: huawei_vrp
      image: ${CORE_IMAGE:=mrja/campus-core01:ce12800-8.180}
      mgmt-ipv4: 172.31.255.11
      ports:
        - "2201:22/tcp"
        - "16101:161/udp"
        - "8001:80/tcp"
        - "8441:443/tcp"
        - "8301:830/tcp"

    agg01:
      kind: huawei_vrp
      image: ${AGG_IMAGE:=mrja/campus-agg01:ce12800-8.180}
      mgmt-ipv4: 172.31.255.21
      ports:
        - "2202:22/tcp"
        - "16102:161/udp"
        - "8002:80/tcp"
        - "8442:443/tcp"
        - "8302:830/tcp"

    access11:
      kind: huawei_vrp
      image: ${ACCESS11_IMAGE:=mrja/campus-access11:ce12800-8.180}
      mgmt-ipv4: 172.31.255.31
      ports:
        - "2211:22/tcp"
        - "16111:161/udp"
        - "8011:80/tcp"
        - "8451:443/tcp"
        - "8311:830/tcp"

    access12:
      kind: huawei_vrp
      image: ${ACCESS12_IMAGE:=mrja/campus-access12:ce12800-8.180}
      mgmt-ipv4: 172.31.255.32
      ports:
        - "2212:22/tcp"
        - "16112:161/udp"
        - "8012:80/tcp"
        - "8452:443/tcp"
        - "8312:830/tcp"
  links:
    - endpoints: ["core01:eth1", "agg01:eth1"]
    - endpoints: ["agg01:eth2", "access11:eth1"]
    - endpoints: ["agg01:eth3", "access12:eth1"]
